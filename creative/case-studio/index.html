<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case studies — Ismael Rivela Jelliti · VAMPS</title>
  <meta name="description" content="Brand and concept case studies: La Tulipana, Copydad and VAMPS. Art direction and identity by Ismael Rivela Jelliti." />
  <meta name="author" content="Ismael Rivela Jelliti" />
  <link rel="canonical" href="https://levamps.com/creative/case-studio/" />
  <meta property="og:title" content="Case studies — Ismael Rivela Jelliti" />
  <meta property="og:description" content="La Tulipana, Copydad and VAMPS — concept and art direction." />
  <meta property="og:url" content="https://levamps.com/creative/case-studio/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VAMPS" />
  <meta property="og:image" content="https://levamps.com/assets/projects/tulipana/parallax/fondo.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://levamps.com/assets/projects/tulipana/parallax/fondo.webp" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/case-studio.css" />
  <link rel="stylesheet" href="/css/case-studio-parallax.css" />
</head>
<body data-case="tulipana">

  <div class="cstudio" data-case-studio>
    <section class="cstudio__hero" data-hero aria-hidden="true"></section>

    <div class="cstudio__sheet">
      <div class="cstudio__grid">
        <aside class="cstudio__spec">
          <div class="cstudio__lang" data-lang-toggle role="group" aria-label="Language">
            <button type="button" class="cstudio__lang-btn" data-lang="en" aria-pressed="false">EN</button>
            <span class="cstudio__lang-sep" aria-hidden="true">/</span>
            <button type="button" class="cstudio__lang-btn" data-lang="es" aria-pressed="false">ES</button>
          </div>
          <div class="cstudio__spec-scroll">
            <div class="cstudio__rows" data-meta-rows></div>
            <div class="cstudio__rows" data-rows></div>
          </div>
        </aside>

        <div class="cstudio__stage-col">
          <div class="cstudio__stage" data-stage>
            <div class="cstudio__viewer" data-viewer aria-live="polite"></div>
            <div class="cstudio__dock-scene" data-dock-scene>
              <div class="cstudio__dock-ring" data-dock-ring></div>
            </div>
            <footer class="cstudio__stage-foot">
              <span class="cstudio__stage-index">
                <span data-carousel-index>01</span> / <span data-carousel-count>00</span>
              </span>
              <span class="cstudio__stage-label" data-carousel-label hidden></span>
            </footer>
          </div>
        </div>

        <nav class="cstudio__case-nav" data-case-nav hidden></nav>
      </div>
    </div>

    <header class="cstudio__nav">
      <a class="cstudio__nav-logo" href="/creative/" aria-label="Creative">
        <img
          src="/assets/brand/studio-logo.png"
          alt="Studio"
          width="300"
          height="120"
          decoding="async"
        />
      </a>
    </header>
  </div>

  <script type="module">
    import { initCaseStudio } from "/js/case-studio.js";
    initCaseStudio();
  </script>
</body>
</html>
